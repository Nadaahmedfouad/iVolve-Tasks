---
- name: Install and configure MySQL on AWS EC2
  hosts: ivolve_servers
  become: true

  vars_files:
    - vault.yml

  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: /home/ansible/ansible-lab-key.pem
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install MySQL and Python dependencies
      ansible.builtin.apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present
        update_cache: true

    - name: Ensure MySQL is running
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create ivolve database
      community.mysql.mysql_db:
        name: ivolve
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create ivolveuser with database privileges
      community.mysql.mysql_user:
        name: ivolveuser
        password: "{{ mysql_user_password }}"
        priv: "ivolve.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true
